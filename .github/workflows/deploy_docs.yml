name: Deploy Docs 

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Check Fern version
        run: fern --version
      
      - name: Deploy Docs
        run: fern generate --docs
        env:
